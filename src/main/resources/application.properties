spring.application.name=farm-erp
server.port=8083

# Read secrets from .env (that file is never committed to Git)
spring.config.import=optional:file:.env[.properties]

# Where the database is, and how to log in
spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway builds the tables. Hibernate only checks them.
spring.jpa.hibernate.ddl-auto=validate