services:
  db:
    image: postgres:18
    container_name: farm-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - farm-erp-data:/var/lib/postgresql

volumes:
  farm-erp-data: